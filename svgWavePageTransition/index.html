<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="./style.css">
    <title>Wave Transition</title>
</head>
<body>
    <section class="intro">
        <h1>Don't blink!</h1>
    </section>
    <section class="spotlight">
        <div class="spotlight-content spotlight-content-in">
            <h2>Wait for it</h2>
            <p>It's getting closer every second. Don't miss the spotlight.</p>
        </div>

        <div class="spotlight-content spotlight-content-out">
            <h2>Here it is</h2>
            <p>Payoff for your attention.</p>
        </div>

        </div>
        <svg
    class="sparkles"
    viewBox="0 0 1600 900"
    preserveAspectRatio="xMidYMid slice"
    xmlns="http://www.w3.org/2000/svg">
    <g
        fill="#fff"
        stroke="#141414"
        stroke-width="4"
        stroke-linejoin="round">
        <g transform="translate(360 230) scale(1.5)">
            <path
                class="sparkle"
                vector-effect="non-scaling-stroke"
                d="M 0 -55 C 8 -16 16 -8 55 0 C 16 8 8 16 0 55 C -8 16 -16 8 -55 0 C -16 -8 -8 -16 0 -55 Z"
            />
        </g>
        <g transform="translate(1180 520) scale(1)">

                d="M 0 -55 C 8 -16 16 -8 55 0 C 16 8 8 16 0 55 C -8 16 -16 8 -55 0 C -16 -8 -8 -16 0 -55 Z"
            />
